<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F3F5F7;--sf:#fff;--ink:#18212B;--mu:#5B6776;--ln:#E1E6EC;--ac:#0E7C7B;--acs:#D9EFEE;--ok:#0E7C7B;--wn:#A8570F;--bd:#B3261E;--sh:0 1px 2px rgba(24,33,43,.06);color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E141A;--sf:#16202A;--ink:#E8EDF2;--mu:#94A1AF;--ln:#26323E;--ac:#3FC1BD;--acs:#16373B;--ok:#3FC1BD;--wn:#E3994F;--bd:#F08A82;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E141A;--sf:#16202A;--ink:#E8EDF2;--mu:#94A1AF;--ln:#26323E;--ac:#3FC1BD;--acs:#16373B;--ok:#3FC1BD;--wn:#E3994F;--bd:#F08A82;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:24px 20px 48px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-size:26px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mu);margin:4px 0 0}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:8px;background:var(--sf);padding:3px}
.seg button{border:0;background:none;color:var(--mu);font:inherit;font-weight:600;padding:5px 14px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ac);color:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed=true]{color:#06201f}}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;box-shadow:var(--sh)}
.bar label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu);font-weight:600}
select,input[type=date],input[type=search]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:7px;padding:6px 9px;min-width:130px}
.ghost{font:inherit;font-weight:600;color:var(--ac);background:none;border:1px solid var(--ln);border-radius:7px;padding:6px 12px;cursor:pointer;margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:8px;margin:12px 0}
.chip{font:inherit;font-size:12px;font-weight:600;background:var(--acs);color:var(--ink);border:0;border-radius:999px;padding:4px 10px;cursor:pointer}
.chip b{color:var(--ac);margin-left:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:12px}
.kpi,.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:16px;box-shadow:var(--sh)}
.kpi span{color:var(--mu);font-weight:600;font-size:12.5px}
.kpi strong{display:block;font-size:27px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.kpi small{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.c8{grid-column:span 8}.c4{grid-column:span 4}.c12{grid-column:span 12}
@media(max-width:960px){.c8,.c4{grid-column:span 12}}
.card h2{font-size:14px;margin:0 0 12px;font-weight:700}
.card h2 small{font-weight:500;color:var(--mu);margin-left:6px}
#trend{width:100%;height:240px}
#trend svg{display:block;width:100%;height:100%}
.row{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;gap:10px;align-items:center;width:100%;font:inherit;color:var(--ink);background:none;border:0;padding:5px 4px;border-radius:6px;cursor:pointer;text-align:left}
.row:hover{background:var(--bg)}
.row .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tr{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.row i{display:block;height:100%;background:var(--ac);border-radius:4px;transition:width .3s}
.row .vl{font-weight:600;min-width:62px;text-align:right}
.row.on{background:var(--acs)}.row.dim{opacity:.45}
.tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--mu);font-weight:700}
th button{font:inherit;color:inherit;font-weight:inherit;background:none;border:0;padding:0;cursor:pointer}
.n{text-align:right}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid currentColor}
.Delivered{color:var(--ok)}.Pending{color:var(--wn)}.Returned,.Cancelled{color:var(--bd)}
.pg{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--mu)}
.pg button{font:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:7px;padding:5px 12px;cursor:pointer}
.pg button:disabled{opacity:.4;cursor:default}
.empty{padding:28px;text-align:center;color:var(--mu)}
#tt{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:7px;font-size:12.5px;font-weight:600;opacity:0;z-index:9;transform:translate(-50%,-120%)}
@media(prefers-reduced-motion:reduce){.row i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div><h1>Sales performance</h1><p class="sub" id="sub"></p></div>
 <div class="seg" role="group" aria-label="Chart metric"><button id="m-amt" aria-pressed="true">Revenue</button><button id="m-cnt" aria-pressed="false">Orders</button></div>
</header>
<section class="bar" aria-label="Filters">
 <label>From<input type="date" id="from"></label>
 <label>To<input type="date" id="to"></label>
 <label>Region<select data-f="region"></select></label>
 <label>Category<select data-f="cat"></select></label>
 <label>Salesperson<select data-f="rep"></select></label>
 <label>Status<select data-f="status"></select></label>
 <button class="ghost" id="reset">Reset filters</button>
</section>
<div class="chips" id="chips" aria-live="polite"></div>
<section class="kpis" id="kpis"></section>
<div class="grid">
 <div class="card c8"><h2 id="t-trend">Monthly trend<small>Select a month to filter</small></h2><div id="trend"></div></div>
 <div class="card c4"><h2>By category</h2><div id="b-cat"></div></div>
 <div class="card c4"><h2>Top cities</h2><div id="b-city"></div></div>
 <div class="card c4"><h2>Top products</h2><div id="b-prod"></div></div>
 <div class="card c4"><h2>By salesperson</h2><div id="b-rep"></div></div>
 <div class="card c4"><h2>By region</h2><div id="b-region"></div></div>
 <div class="card c4"><h2>Payment method</h2><div id="b-pay"></div></div>
 <div class="card c4"><h2>Order status</h2><div id="b-status"></div></div>
 <div class="card c12">
  <div class="tools"><h2 style="margin:0">Orders</h2><input type="search" id="q" placeholder="Search order, customer, product, city" aria-label="Search orders" style="min-width:min(320px,100%)"></div>
  <div class="tw"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  <div class="pg"><span id="pinfo"></span><button id="prev">Previous</button><button id="next">Next</button></div>
 </div>
</div>
</div>
<div id="tt" role="status"></div>

const COLS=['id','date','cust','region','city','cat','prod','qty','price','disc','amt','rep','pay','status'];
const rows=RAW.map(r=>Object.fromEntries(COLS.map((c,i)=>[c,r[i]])));
const DIMS=['region','cat','status','rep','city','prod','pay'];
const LBL={region:'Region',cat:'Category',status:'Status',rep:'Salesperson',city:'City',prod:'Product',pay:'Payment',month:'Month'};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const months=[...new Set(rows.map(r=>r.date.slice(0,7)))].sort();
const ml=m=>MN[+m.slice(5)-1]+' '+m.slice(0,4);
const ms=m=>MN[+m.slice(5)-1]+' ’'+m.slice(2,4);
const $=s=>document.querySelector(s);
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const sh=n=>n>=1e7?'₹'+(n/1e7).toFixed(2)+' Cr':n>=1e5?'₹'+(n/1e5).toFixed(2)+' L':n>=1e3?'₹'+(n/1e3).toFixed(1)+'K':'₹'+Math.round(n);
let metric='amt',f={},sort={k:'date',d:-1},page=0,q='';
const PS=12;
const fm=v=>metric==='amt'?sh(v):v.toLocaleString('en-IN');
const fmFull=v=>metric==='amt'?inr(v):v.toLocaleString('en-IN')+' orders';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=skip=>rows.filter(r=>DIMS.every(d=>d===skip||!f[d]||r[d]===f[d])&&(skip==='month'||!f.month||r.date.startsWith(f.month))&&(!f.from||r.date>=f.from)&&(!f.to||r.date<=f.to));
const sum=l=>l.reduce((s,r)=>s+r.amt,0);
const mv=l=>metric==='amt'?sum(l):l.length;

// filter controls
const uniq=k=>[...new Set(rows.map(r=>r[k]))].sort();
document.querySelectorAll('select[data-f]').forEach(s=>{const k=s.dataset.f;s.innerHTML='<option value="">All</option>'+uniq(k).map(v=>`<option>${esc(v)}</option>`).join('');s.onchange=()=>{f[k]=s.value;page=0;render()}});
$('#from').min=$('#to').min=rows.reduce((a,r)=>r.date<a?r.date:a,'9');
$('#from').max=$('#to').max=rows.reduce((a,r)=>r.date>a?r.date:a,'0');
$('#from').onchange=e=>{f.from=e.target.value;page=0;render()};
$('#to').onchange=e=>{f.to=e.target.value;page=0;render()};
$('#reset').onclick=()=>{f={};q='';$('#q').value='';page=0;render()};
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();page=0;table()};
$('#m-amt').onclick=()=>setM('amt');$('#m-cnt').onclick=()=>setM('cnt');
function setM(m){metric=m;$('#m-amt').setAttribute('aria-pressed',m==='amt');$('#m-cnt').setAttribute('aria-pressed',m==='cnt');render()}
$('#prev').onclick=()=>{page--;table()};$('#next').onclick=()=>{page++;table()};

document.addEventListener('click',e=>{
 const r=e.target.closest('.row');if(r){const d=r.dataset.d,v=r.dataset.v;f[d]=f[d]===v?'':v;page=0;render();return}
 const c=e.target.closest('.chip');if(c){f[c.dataset.x]='';page=0;render();return}
 const h=e.target.closest('[data-m]');if(h){f.month=f.month===h.dataset.m?'':h.dataset.m;page=0;render();return}
 const s=e.target.closest('[data-s]');if(s){const k=s.dataset.s;sort=sort.k===k?{k,d:-sort.d}:{k,d:1};table()}
});

function kpis(){
 const l=pick(),rev=sum(l),lost=sum(l.filter(r=>r.status==='Returned'||r.status==='Cancelled'));
 const disc=l.length?l.reduce((s,r)=>s+r.disc,0)/l.length:0;
 const items=[['Revenue',sh(rev),inr(rev)],['Orders',l.length.toLocaleString('en-IN'),new Set(l.map(r=>r.cust)).size+' customers'],['Average order',l.length?sh(rev/l.length):'–','per order'],['Average discount',(disc*100).toFixed(1)+'%','across filtered orders'],['Lost to returns and cancellations',sh(lost),(rev?(lost/rev*100).toFixed(1):0)+'% of revenue']];
 $('#kpis').innerHTML=items.map(i=>`<div class="kpi"><span>${i[0]}</span><strong>${i[1]}</strong><small>${i[2]}</small></div>`).join('');
}

function bars(id,dim,lim){
 const g={};pick(dim).forEach(r=>g[r[dim]]=(g[r[dim]]||0)+(metric==='amt'?r.amt:1));
 let e=Object.entries(g).sort((a,b)=>b[1]-a[1]);
 const tot=e.reduce((s,x)=>s+x[1],0),top=e.slice(0,lim);
 if(f[dim]&&!top.some(x=>x[0]===f[dim])&&g[f[dim]]!==undefined)top.push([f[dim],g[f[dim]]]);
 const mx=top[0]?top[0][1]:1;
 $(id).innerHTML=top.length?top.map(([k,v])=>{const on=f[dim]===k;return `<button class="row ${on?'on':''} ${f[dim]&&!on?'dim':''}" data-d="${dim}" data-v="${esc(k)}" aria-pressed="${on}" title="${esc(k)}: ${fmFull(v)} (${(v/tot*100).toFixed(1)}%)"><span class="lb">${esc(k)}</span><span class="tr"><i style="width:${v/mx*100}%"></i></span><span class="vl">${fm(v)}</span></button>`}).join(''):'<div class="empty">No data</div>';
}

function trend(){
 const el=$('#trend'),w=el.clientWidth||600,h=240,L=50,R=12,T=12,B=28,n=months.length;
 const by=Object.fromEntries(months.map(m=>[m,0]));
 pick('month').forEach(r=>by[r.date.slice(0,7)]+=metric==='amt'?r.amt:1);
 const vals=months.map(m=>by[m]),mx=Math.max(...vals,1)*1.1,sx=(w-L-R)/(n-1),y=v=>T+(h-T-B)*(1-v/mx),x=i=>L+i*sx;
 let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Monthly ${metric==='amt'?'revenue':'orders'} trend">`;
 for(let i=0;i<=4;i++){const v=mx/4*i;s+=`<line x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--ln)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--mu)">${fm(v)}</text>`}
 const k=Math.ceil(n/Math.max(2,Math.floor(w/64)));
 months.forEach((m,i)=>{if(i%k===0)s+=`<text x="${x(i)}" y="${h-8}" text-anchor="middle" font-size="11" fill="var(--mu)">${ms(m)}</text>`});
 const pts=vals.map((v,i)=>x(i)+','+y(v));
 s+=`<polygon points="${x(0)},${y(0)} ${pts.join(' ')} ${x(n-1)},${y(0)}" fill="var(--ac)" opacity=".12"/><polyline points="${pts.join(' ')}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>`;
 months.forEach((m,i)=>{const on=f.month===m;s+=`<circle cx="${x(i)}" cy="${y(vals[i])}" r="${on?6:3}" fill="${on?'var(--sf)':'var(--ac)'}" stroke="var(--ac)" stroke-width="${on?3:0}"/><rect data-m="${m}" data-v="${vals[i]}" x="${x(i)-sx/2}" y="${T}" width="${sx}" height="${h-T-B}" fill="transparent" style="cursor:pointer"/>`});
 el.innerHTML=s+'</svg>';
}
const tt=$('#tt');
document.addEventListener('mouseover',e=>{const m=e.target.closest&&e.target.closest('rect[data-m]');if(!m)return;tt.innerHTML=ml(m.dataset.m)+': '+fmFull(+m.dataset.v);tt.style.opacity=1});
document.addEventListener('mousemove',e=>{tt.style.left=e.clientX+'px';tt.style.top=e.clientY+'px'});
document.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('rect[data-m]'))tt.style.opacity=0});

function table(){
 const H=[['id','Order'],['date','Date'],['cust','Customer'],['city','City'],['prod','Product'],['qty','Qty'],['amt','Amount'],['status','Status']];
 $('#thead').innerHTML='<tr>'+H.map(([k,t])=>`<th class="${k==='qty'||k==='amt'?'n':''}" aria-sort="${sort.k===k?(sort.d>0?'ascending':'descending'):'none'}"><button data-s="${k}">${t}${sort.k===k?(sort.d>0?' ↑':' ↓'):''}</button></th>`).join('')+'</tr>';
 const l=pick().filter(r=>!q||(r.id+r.cust+r.prod+r.city).toLowerCase().includes(q));
 l.sort((a,b)=>{const x=a[sort.k],y=b[sort.k];return(x>y?1:x<y?-1:0)*sort.d});
 const pages=Math.max(1,Math.ceil(l.length/PS));page=Math.min(Math.max(page,0),pages-1);
 const v=l.slice(page*PS,page*PS+PS);
 $('#tbody').innerHTML=v.length?v.map(r=>`<tr><td>${r.id}</td><td>${r.date}</td><td>${esc(r.cust)}</td><td>${esc(r.city)}</td><td>${esc(r.prod)}</td><td class="n">${r.qty}</td><td class="n">${inr(r.amt)}</td><td><span class="pill ${r.status}">${r.status}</span></td></tr>`).join(''):'<tr><td colspan="8" class="empty">No orders match these filters. Remove a filter or reset to see all orders.</td></tr>';
 $('#pinfo').textContent=l.length?`${page*PS+1}–${Math.min(l.length,page*PS+PS)} of ${l.length}`:'0 orders';
 $('#prev').disabled=page===0;$('#next').disabled=page>=pages-1;
}

function render(){
 document.querySelectorAll('select[data-f]').forEach(s=>s.value=f[s.dataset.f]||'');
 $('#from').value=f.from||'';$('#to').value=f.to||'';
 $('#chips').innerHTML=[...DIMS,'month'].filter(k=>f[k]).map(k=>`<button class="chip" data-x="${k}" aria-label="Remove ${LBL[k]} filter">${LBL[k]}: ${esc(k==='month'?ml(f[k]):f[k])}<b>×</b></button>`).join('');
 kpis();trend();
 bars('#b-cat','cat',6);bars('#b-city','city',8);bars('#b-prod','prod',8);bars('#b-rep','rep',6);bars('#b-region','region',6);bars('#b-pay','pay',6);bars('#b-status','status',6);
 table();
}
$('#sub').textContent=`${rows.length} orders from ${ml(months[0])} to ${ml(months[months.length-1])}. Amounts are in Indian rupees.`;
new ResizeObserver(()=>trend()).observe($('#trend'));
render();
</script>
